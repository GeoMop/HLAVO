name: HLAVO Dashboard - pull request

on:
  pull_request:
    branches:
      - "**"
    paths:
      - dashboard/**
      - .github/workflows/hlavo-dashboard-pull-request.yaml
  workflow_dispatch:

jobs:
  deploy:
    name: HLAVO dashboard
    uses: GeoMop/zarr_fuse/.github/workflows/dashboard-reusable-workflow.yaml@feature/dashboard-multiple-selection

    with:
      zarr-fuse-ref: feature/dashboard-multiple-selection

      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      source-endpoints-path: dashboard/config/endpoints.yaml
      source-schemas-path: dashboard/config/schemas

      frontend_image: jbrezmorf/hlavo-dashboard-ui-frontend
      namespace: hlavo-dashboard-ui
      release-name: hlavo-dashboard-ui
      configmap_name: hlavo-dashboard-config
      mount-volume-name: hlavo-config

      deploy: true
      push-container: true
      tag: generate

    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}
      source_repo_token: ${{ secrets.GITHUB_TOKEN }}
      zarr_repo_token: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      s3_access_key: ${{ secrets.S3_ACCESS_KEY }}         
      s3_secret_key: ${{ secrets.S3_SECRET_KEY }}