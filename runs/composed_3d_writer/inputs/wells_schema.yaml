ATTRS:
  description: "Longterm waterlevel measurements and water draw around water source\
    \ Uheln\xE1."
  STORE_URL: /home/hlavo/workspace/runs/composed_3d_writer/inputs/wells.zarr
  S3_ENDPOINT_URL: https://s3.cl4.du.cesnet.cz
  LOGGER: local
Uhelna:
  water_levels:
    ATTRS:
      description: Water table levels.
    COORDS:
      date_time:
        unit:
          tick: m
          tz: UTC
        description: Time coordinate
        source_unit:
          tick: m
          tz: CET
        sorted: true
        chunk_size: 1024
        step_limits:
        - 1
        - 1
        - h
      well_id:
        description: Full borehole id.
        type: str[16]
        sorted: []
        chunk_size: 1
      interval_num_from_top:
        description: Index of boreholoe open interval. Indexed from top to bottom.
        type: str[16]
        sorted: true
        chunk_size: 16
    VARS:
      water_level:
        unit: m
        type: float
        na_value: nan
        description: Water table level, meters above see
        coords:
        - date_time
        - well_id
      water_depth:
        unit: m
        type: float
        na_value: nan
        description: Water level depth relative to the borehole head.
        coords:
        - date_time
        - well_id
      well_in_section_file:
        type: str[32]
        description: Well full name (including collector).
        coords:
        - well_id
      confirmed:
        type: int32
        na_value: 0
        description: Sign of existing sheetname in file of measured data
        coords:
        - well_id
      X:
        unit: m
        type: float
        na_value: nan
        description: X-coord of well in JTSK
        coords:
        - well_id
      Y:
        unit: m
        type: float
        na_value: nan
        description: Y-coord of well in JTSK
        coords:
        - well_id
      longitude:
        description: GPS. Signed Earth longitude. Indicated by the probe itself.
        unit: deg
        type: float
        na_value: nan
        coords:
        - well_id
      latitude:
        description: GPS. Signed Earth latitude. Indicated by the probe itself.
        unit: deg
        type: float
        na_value: nan
        coords:
        - well_id
      Z:
        unit: m
        type: float
        na_value: nan
        description: Altitude of the borehole head (above see level).
        coords:
        - well_id
      collector:
        type: str[32]
        description: Name of collector.
        coords:
        - well_id
      interval_min:
        unit: m
        type: float
        description: Depth of interval start measured from the borehole head.
        coords:
        - well_id
        - interval_num_from_top
      interval_max:
        unit: m
        type: float
        description: Depth of interval stop measured from the borehole head.
        coords:
        - well_id
        - interval_num_from_top
  water_draw:
    ATTRS:
      description: "Water draws on Uheln\xE1 locality"
      VERSION: 0.3.0
    VARS:
      cum_draw:
        unit: m ** 3
        description: Total water draw per month.
        coords:
        - date
        - well_id
      longitude:
        description: GPS. Signed Earth longitude. Indicated by the probe itself.
        unit: deg
        type: float
        na_value: nan
        coords:
        - well_id
      latitude:
        description: GPS. Signed Earth latitude. Indicated by the probe itself.
        unit: deg
        type: float
        na_value: nan
        coords:
        - well_id
    COORDS:
      date:
        unit:
          tick: h
          tz: UTC
        description: Time coordinate
        source_unit:
          tick: h
          tz: CET
        sorted: true
        chunk_size: 1024
        step_limits:
        - 1
        - 1
        - M
      well_id:
        description: "Draw well id. (just single well for Uheln\xE1 locality)"
        type: str[16]
        sorted: []
        chunk_size: 1
